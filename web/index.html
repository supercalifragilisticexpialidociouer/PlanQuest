<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' file: blob:; connect-src 'self' file: blob: wss: https:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: https:; media-src 'self' file: mediastream: blob:;" />
  <title>PlanQuest · 计划打卡</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" data-theme="dark">
    <header class="titlebar">
      <div class="tb-left">
        <img src="../assets/icon.png" alt="" class="tb-logo" draggable="false" />
        <span class="tb-name">PlanQuest</span>
        <span class="tb-sub">计划打卡</span>
      </div>
      <div class="tb-right">
        <button class="tb-btn" id="btn-full" title="全屏 / 退出全屏">
          <svg viewBox="0 0 12 12"><path d="M2 4.5V2h2.5M7.5 2H10v2.5M10 7.5V10H7.5M4.5 10H2V7.5" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tb-btn" id="btn-min" title="最小化">
          <svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="tb-btn tb-close" id="btn-close" title="关闭到托盘">
          <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav id="nav">
          <button class="nav-item active" data-view="today">
            <span class="nav-ico">🌤️</span><span>今日</span>
          </button>
          <button class="nav-item" data-view="plans">
            <span class="nav-ico">🗂️</span><span>计划</span>
          </button>
          <button class="nav-item" data-view="goals">
            <span class="nav-ico">🎯</span><span>目标</span>
          </button>
          <button class="nav-item" data-view="study">
            <span class="nav-ico">📚</span><span>自习房</span>
          </button>
          <button class="nav-item" data-view="legion">
            <span class="nav-ico">🏰</span><span>军团</span>
          </button>
          <button class="nav-item" data-view="friends">
            <span class="nav-ico">🤝</span><span>好友</span>
          </button>
          <button class="nav-item" data-view="guard">
            <span class="nav-ico">🛡️</span><span>守护</span>
          </button>
          <button class="nav-item" data-view="stats">
            <span class="nav-ico">🏅</span><span>成就</span>
          </button>
          <button class="nav-item" data-view="settings">
            <span class="nav-ico">⚙️</span><span>设置</span>
          </button>
        </nav>

        <div class="side-card" id="side-level">
          <div class="side-lv-top">
            <span class="lv-badge" id="side-lv">Lv.1</span>
            <span class="lv-streak" id="side-streak">🔥 0 天</span>
          </div>
          <div class="bar"><div class="bar-fill" id="side-bar" style="width:0%"></div></div>
          <div class="side-lv-sub" id="side-lv-sub">0 / 120 积分</div>
        </div>
      </aside>

      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="fx-root"></div>

  <script src="hr.js"></script>
  <script src="vendor/livekit-client.umd.js"></script>
  <script src="pq-cloud.js"></script>
  <script src="voice-lk.js"></script>
  <script src="vendor/ort/ort.wasm.min.js"></script>
  <script src="vendor/ort/wasm-b64.js"></script>
  <script src="vendor/pq-ai/model-b64.js"></script>
  <script src="ai-watch.js"></script>
  <script src="ai-chat.js"></script>
  <script src="ai-train.js"></script>
  <script src="flip-guard.js"></script>
  <script src="voice-asr.js"></script>
  <script src="ally.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="ala-llm.js"></script>
  <script src="ala-act.js"></script>
  <script src="ala-tips.js"></script>
  <script src="buddy3d.js"></script>
  <script src="buddy.js"></script>
  <script src="share.js"></script>
  <script src="credit-priv.js"></script>
  <script src="chat-mod.js"></script>
  <script src="legion-gov.js"></script>
  <script src="legion-discipline.js"></script>
  <script src="legion-mesh-policy.js"></script>
  <script src="legion-mesh.js"></script>
  <script src="legion-p2p.js"></script>
  <script src="legion-chat.js"></script>
  <script src="legion-tier.js"></script>
  <script src="friend.js"></script>
  <script src="legion-channel.js"></script>
  <script src="legion.js"></script>
  <script src="app.js"></script>
</body>
</html>
