<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿刺 · 分皮肤心情 / 顶罪平衡表</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1f2430;--dim:#697386;--line:#e3e7ee;--accent:#2f9e8f;--warn:#d9752b}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding:28px}
  .wrap{max-width:1080px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--dim);margin-bottom:20px;font-size:13px}
  .note{background:#fff6ec;border:1px solid #f0d6b8;color:#8a5a2b;border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(20,30,50,.04)}
  .card h2{margin:0 0 2px;font-size:16px}.tag{color:var(--dim);font-size:12px;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .row:last-child{border:0}.row b{color:var(--accent);font-weight:600}
  .bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#2f9e8f,#5ec2b3)}
  .lv{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .lv span{background:#eef7f5;color:#24796e;border-radius:20px;padding:2px 10px;font-size:11.5px}
  .mech{margin-top:10px;background:#f3f6fb;border-radius:8px;padding:8px 10px;color:#40506b;font-size:12px}
  code{background:#eef1f6;border-radius:4px;padding:1px 5px;font-size:12px}
  footer{margin-top:22px;color:var(--dim);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>阿刺 · 分皮肤心情 / 顶罪平衡表</h1>
  <div class="sub">第二版规格（仙人掌 / 玫瑰 / 刺猬 / 板栗 / 豪猪）· 开发者内部参考，非用户可见</div>
  <div class="note">⚠️ 顶罪是阿刺自作主张：<code>冷却 → 日上限 → 周限 → 能量 → R(0~100) &lt; finalProb</code>。没有开关、没有求扛入口、界面不摆概率数字。用户不能规定他扛不扛。本表参数仅供平衡性微调。</div>
  <div class="grid" id="g"></div>
  <footer>本地遥测 <code>balanceReport()</code> 记录每次判定（皮肤/档位/roll/结果），仅存本机、不上传、不外显，用于按真实数据微调参数。</footer>
</div>
<script>
const DATA = [
  {id:'cactus',name:'仙人掌（经典款）',tag:'毒舌有分寸 · 认死理 · 嘴硬心软',init:55,emoji:'🌵',
   levels:[['≥80','高效'],['≥40','平稳'],['<40','低效']],
   up:'全勤 +4 / 7连击 +6 / 虚心接受 +3',down:'漏核心 −5 / 删档 −12 / 顶嘴 −4',rec:'凌晨 <55 +3',
   cd:7,day:2,base:'0.22',mod:'85:+0.08 / 60:+0.03 / 35:0 / 15:−0.05 / 低:−0.10',
   mech:'沉默扛下，然后继续毒舌：「哼，顺手而已。别指望我下次还帮你。」'},
  {id:'rose',name:'玫瑰（带刺的花）',tag:'优雅地刻薄 · 花式阴阳 · 记仇也记好',init:45,emoji:'🌹',
   levels:[['≥70','舒坦'],['≥30','一般'],['<30','扎手']],
   up:'全勤 +3 / 被夸 +6 / 连续一周好 +8',down:'漏计划 −2 / 删档 −20 / 批评 −12',rec:'凌晨 <45 +2',
   cd:8,day:1,base:'0.18',mod:'90:+0.15 / 70:+0.05 / 40:−0.02 / 20:−0.10 / 低:−0.18',
   mech:'记忆分 ±0.3%/点，概率钳 1%~40%；阴阳邀功：「记得你欠我一次哦~」'},
  {id:'hedgehog',name:'刺猬（熟了才黏）',tag:'先说狠话 · 再偷偷心软 · 熟了很黏',init:40,emoji:'🦔',
   levels:[['≥75','黏人'],['≥40','别扭'],['<40','炸毛']],
   up:'全勤 +2 / 每日互动亲密 +3 / 熟了 +1',down:'漏计划 −4 / 删档 −15 / 冷落亲密 −8',rec:'凌晨 <40 +2',
   cd:6,day:2,base:'亲密≥70:0.32 / ≥40:0.20 / 陌生:0.10',mod:'80:+0.10 / 50:+0.03 / 25:−0.05 / 低:−0.12',
   mech:'亲密度 0~100 直接影响基础概率；前期「自己犯错自己受」（偷偷顶），后期「要不要我帮你挡雷？当我没说！」'},
  {id:'chestnut',name:'板栗（外壳坚硬，实在）',tag:'不绕弯 · 爱算账 · 说到做到',init:50,emoji:'🌰',
   levels:[['≥75','硬气'],['≥35','稳妥'],['<35','毛躁']],
   up:'全勤 +3 / 还债 +10 / 诚实 +5',down:'漏计划 −3 / 删档 −10 / 赖账 −20',rec:'凌晨 <50 +2',
   cd:5,day:2,base:'0.28',mod:'80:+0.07 / 50:+0.02 / 25:−0.05 / 低:−0.10',
   mech:'顶罪即记账（欠 3 天打卡）：「帮你扛了。记账：未来3天必须打卡，少一天我扎你。」'},
  {id:'porcupine',name:'豪猪（生人勿近）',tag:'不哄 · 不惯 · 不服就干',init:35,emoji:'🐗',
   levels:[['≥70','勉强'],['≥35','冷淡'],['<35','炸刺']],
   up:'证明自己 +8 / 尊重边界 +5 / 21连击 +10',down:'任何失误 −6 / 删档 −25 / 哄他 −10 / 一天不来 −8',rec:'凌晨 <35 +1（极慢）',
   cd:10,day:1,base:'0.12（周限 2）',mod:'85:+0.10 / 60:+0.03 / 35:−0.05 / 15:−0.12 / 低:−0.10（蔑视回升）',
   mech:'极其不屑，顶完不弹窗：「……啧，麻烦。」（用户自己发现能量少了）'},
];
document.getElementById('g').innerHTML = DATA.map(d => `
  <div class="card">
    <h2>${d.emoji} ${d.name}</h2>
    <div class="tag">${d.tag} · 心情初值 ${d.init}</div>
    <div class="bar"><i style="width:${d.init}%"></i></div>
    <div class="lv">${d.levels.map(l=>`<span>${l[0]} ${l[1]}</span>`).join('')}</div>
    <div style="margin-top:10px">
      <div class="row"><span>上升</span><b>${d.up}</b></div>
      <div class="row"><span>下降</span><b>${d.down}</b></div>
      <div class="row"><span>自然恢复</span><b>${d.rec}</b></div>
      <div class="row"><span>顶罪冷却 / 日限</span><b>${d.cd}h / ${d.day}次</b></div>
      <div class="row"><span>基础概率</span><b>${d.base}</b></div>
      <div class="row"><span>心情修正</span><b style="font-size:11.5px">${d.mod}</b></div>
    </div>
    <div class="mech">${d.mech}</div>
  </div>`).join('');
</script>
</body>
</html>
