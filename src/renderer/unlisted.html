<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; style-src 'unsafe-inline'; script-src 'self' file:;" />
  <title>检测到未授权软件</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
      display: grid; place-items: center; padding: 12px; user-select: none;
    }
    .card {
      width: 100%;
      background: linear-gradient(160deg, #241a2e 0%, #15121f 100%);
      border: 1px solid rgba(255, 140, 100, 0.28);
      border-radius: 20px;
      padding: 20px 22px 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      animation: pop 0.26s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(0.96); } to { opacity: 1; transform: none; } }

    .head { display: flex; align-items: center; gap: 13px; }
    .ico {
      width: 46px; height: 46px; border-radius: 14px; flex: none;
      display: grid; place-items: center; font-size: 23px;
      background: rgba(255, 140, 100, 0.16);
    }
    .cap { font-size: 10.5px; font-weight: 700; letter-spacing: 2px; color: #ff9f7a; }
    .title { font-size: 17.5px; font-weight: 800; color: #f3eef7; margin-top: 2px; }
    .desc { font-size: 12.5px; color: #b6aec6; margin-top: 4px; line-height: 1.5; }

    .list { margin-top: 13px; display: flex; flex-direction: column; gap: 6px; max-height: 150px; overflow-y: auto; }
    .item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: rgba(255, 255, 255, 0.055);
      border-radius: 11px;
      padding: 8px 12px;
    }
    .nm { font-size: 13px; font-weight: 700; color: #eae6f2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ct { font-size: 11px; font-weight: 800; color: #ffb199; flex: none; }
    .ct.hot { color: #ff7a5c; }

    .warn {
      margin-top: 11px; font-size: 11.5px; line-height: 1.5;
      color: #ffb199; background: rgba(255, 122, 92, 0.1);
      border-radius: 10px; padding: 8px 11px;
    }
    .btns { display: flex; gap: 9px; margin-top: 15px; }
    button {
      font-family: inherit; font-weight: 800; font-size: 13px;
      border: 0; border-radius: 12px; padding: 10px 0; cursor: pointer; transition: all 0.15s;
    }
    button:active { transform: scale(0.97); }
    .kill { flex: 1.4; color: #fff; background: linear-gradient(135deg, #ff7a5c, #ffb04d); box-shadow: 0 8px 22px rgba(255, 122, 92, 0.28); }
    .kill:hover { filter: brightness(1.08); }
    .ok { flex: 1; background: rgba(255, 255, 255, 0.09); color: #c8c2d6; }
    .ok:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="ico">⚠️</div>
      <div>
        <div class="cap">强制模式 · 软件提醒</div>
        <div class="title">检测到名单外的软件</div>
        <div class="desc">这些软件不在白/灰/黑名单里，请确认是否应该继续使用。</div>
      </div>
    </div>
    <div class="list" id="u-list"></div>
    <div class="warn" id="u-warn"></div>
    <div class="btns">
      <button class="kill" id="u-kill">全部关闭</button>
      <button class="ok" id="u-ok">知道了</button>
    </div>
  </div>
  <script src="unlisted.js"></script>
</body>
</html>
