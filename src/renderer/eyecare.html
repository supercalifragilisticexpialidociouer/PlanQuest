<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file: blob:;"
    />
    <title>护眼时间</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        background: linear-gradient(160deg, #0f2d24 0%, #123f31 55%, #0d4a3a 100%);
        color: #eafff6;
        display: grid;
        place-items: center;
        user-select: none;
      }
      body.rest { background: #000; color: #cfd8d3; }
      .wrap { text-align: center; padding: 32px; max-width: 980px; width: 100%; }
      .cap { font-size: 13px; letter-spacing: 6px; opacity: 0.75; }
      h1 { font-size: 34px; font-weight: 800; margin: 12px 0 4px; letter-spacing: 2px; }
      .sub { font-size: 14px; opacity: 0.72; margin-bottom: 20px; }
      .vbox {
        position: relative;
        width: min(880px, 82vw);
        margin: 0 auto;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
        background: #000;
      }
      video { display: block; width: 100%; max-height: 62vh; }
      .clock { font-size: 54px; font-weight: 800; letter-spacing: 2px; font-variant-numeric: tabular-nums; line-height: 1; margin-top: 22px; }
      .bar { width: min(560px, 70vw); height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.14); margin: 20px auto 0; overflow: hidden; }
      .bar i { display: block; height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, #37e0a8, #7be27b); transition: width 0.6s linear; }
      body.rest .bar i { background: linear-gradient(90deg, #3d6f9e, #7ba8d8); }
      .rest-hint { margin-top: 26px; font-size: 15px; opacity: 0.55; line-height: 1.9; display: none; }
      .skip {
        margin-top: 30px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.28);
        color: rgba(255, 255, 255, 0.75);
        font-size: 13px;
        padding: 9px 22px;
        border-radius: 99px;
        cursor: pointer;
      }
      .skip:hover { border-color: rgba(255, 255, 255, 0.6); color: #fff; }
      .vload { position: absolute; inset: 0; display: grid; place-items: center; color: #9fe8c9; font-size: 14px; letter-spacing: 2px; }
      .pw-mask {
        position: fixed; inset: 0; background: rgba(4, 10, 8, 0.72);
        display: none; place-items: center; z-index: 9;
      }
      .pw-mask.show { display: grid; }
      .pw-box {
        width: 340px; background: #14231d; border: 1px solid #2c4a3d;
        border-radius: 16px; padding: 22px; text-align: left;
      }
      .pw-box .tt { font-size: 14.5px; font-weight: 700; margin-bottom: 12px; }
      .pw-box input {
        width: 100%; padding: 10px 12px; border-radius: 10px;
        border: 1px solid #2c4a3d; background: #0d1813; color: #eafff6; font-size: 14px;
      }
      .pw-err { color: #ff8f8f; font-size: 12px; margin-top: 8px; min-height: 16px; }
      .pw-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
      .pw-btns button { padding: 8px 18px; border-radius: 10px; font-size: 13px; cursor: pointer; }
      .pw-btns .no { background: transparent; border: 1px solid #2c4a3d; color: #9db8ac; }
      .pw-btns .ok { background: #2fae83; border: 0; color: #fff; font-weight: 700; }
      .shake { animation: shake 0.4s ease; }
      @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="cap" id="cap">EYE CARE · 护眼时间</div>
      <h1 id="title">👁 眼保健操时间</h1>
      <div class="sub" id="sub">跟着视频做一做 · 做完自动进入息屏</div>

      <div class="vbox" id="vbox">
        <video id="video" src="assets/eyecare.mp4" autoplay playsinline></video>
        <div class="vload" id="vload">视频加载中…</div>
      </div>

      <div class="clock" id="clock">--:--</div>
      <div class="bar"><i id="bar"></i></div>
      <div class="rest-hint" id="rest-hint">
        望向 6 米以外的远处，放松睫状肌<br />不要看手机，让眼睛真正休息
      </div>
      <button class="skip" id="skip">跳过本轮（需要守护密码）</button>
    </div>

    <div class="pw-mask" id="pw-mask">
      <div class="pw-box" id="pw-box">
        <div class="tt">🔒 跳过需要验证守护密码</div>
        <input type="password" id="pw" autocomplete="off" placeholder="输入守护密码" />
        <div class="pw-err" id="pw-err"></div>
        <div class="pw-btns">
          <button class="no" id="pw-no">取消</button>
          <button class="ok" id="pw-ok">验证并跳过</button>
        </div>
      </div>
    </div>

    <script src="eyecare.js"></script>
  </body>
</html>
