<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; style-src 'unsafe-inline'; script-src 'self' file:;" />
  <title>该打卡了</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 14px;
      user-select: none;
    }
    .card {
      width: 100%;
      background: linear-gradient(160deg, #1b1e38 0%, #14162b 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 22px 24px 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      animation: pop 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(18px) scale(0.96); } to { opacity: 1; transform: none; } }

    .head { display: flex; align-items: center; gap: 14px; }
    .ico {
      width: 52px; height: 52px;
      border-radius: 15px;
      display: grid; place-items: center;
      font-size: 26px;
      flex: none;
      animation: wiggle 2.2s ease-in-out infinite;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      5%, 13% { transform: rotate(8deg); }
      9%, 17% { transform: rotate(-8deg); }
      21% { transform: rotate(0); }
    }
    .cap { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #8f93b8; }
    .title { font-size: 19px; font-weight: 800; color: #eef0f8; margin-top: 3px; }
    .desc { font-size: 12.5px; color: #a7abc4; margin-top: 4px; line-height: 1.5; }

    .meta { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .chip {
      font-size: 11.5px; font-weight: 700;
      padding: 5px 11px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.07);
      color: #a7abc4;
    }
    .chip.accent { color: #b7adff; background: rgba(124, 108, 255, 0.16); }
    .chip.gain { color: #4de3c3; background: rgba(23, 205, 168, 0.14); }

    .btns { display: flex; gap: 9px; margin-top: 18px; }
    button {
      font-family: inherit;
      font-weight: 800;
      font-size: 13.5px;
      border: 0;
      border-radius: 12px;
      padding: 11px 0;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:active { transform: scale(0.97); }
    .done {
      flex: 2.2;
      color: #fff;
      background: linear-gradient(135deg, #7c6cff, #17cda8);
      box-shadow: 0 8px 22px rgba(60, 140, 220, 0.35);
    }
    .done:hover { filter: brightness(1.1); }
    .later { flex: 1; background: rgba(255, 255, 255, 0.08); color: #a7abc4; }
    .later:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
    .skip { flex: 0.8; background: transparent; color: #6d7190; font-weight: 600; }
    .skip:hover { color: #a7abc4; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="ico" id="r-ico">🎯</div>
      <div>
        <div class="cap" id="r-cap">到点提醒</div>
        <div class="title" id="r-title">—</div>
        <div class="desc" id="r-desc"></div>
      </div>
    </div>
    <div class="meta" id="r-meta"></div>
    <div class="btns">
      <button class="done" id="r-done">✓ 完成打卡</button>
      <button class="later" id="r-later">稍后</button>
      <button class="skip" id="r-skip">跳过</button>
    </div>
  </div>
  <script src="reminder.js"></script>
</body>
</html>
